[build]
  command         = "mkdir -p _includes && curl -sL 'https://raw.githubusercontent.com/felipe-c-barbosa/blog-to-netlify/main/_includes/shared-footer.html' -o _includes/shared-footer.html && bundle exec jekyll build"
  publish         = "_site"

[build.environment]
  RUBY_VERSION    = "3.3.0"
  JEKYLL_ENV      = "production"

# Redireciona raiz para /consultoria/ caso queira a landing page como home
# Descomente as linhas abaixo se quiser esse comportamento:
# [[redirects]]
#   from   = "/"
#   to     = "/consultoria/"
#   status = 301

# Headers de segurança e cache para assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://js.hs-scripts.com https://js.hs-analytics.net https://js.hsadspixel.net https://js.hscollectedforms.net https://js.usemessages.com https://js.hs-banner.com https://js.hsleadflows.net https://js.hsforms.net https://static.hsappstatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://static.hsappstatic.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://cloudflareinsights.com https://api.hubapi.com https://api.hubspot.com https://forms.hubspot.com https://forms.hscollectedforms.net https://track.hubspot.com https://cta-service-cms2.hubspot.com https://static.hsappstatic.net; frame-src https://app.hubspot.com https://hubspot-forms-public.s3.amazonaws.com; frame-ancestors 'none';"
