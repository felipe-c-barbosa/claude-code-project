  <script type="application/ld+json">
  [

      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Felipe Barbosa",
      "jobTitle": "Consultor de Marketing de Produto",

      "url": "https://consultoria.felipebarbosa.me",

        "@type": "Organization",
        "name": "Nubank"
      },

        "Marketing B2B",
        "SaaS Marketing",
        "Estratégia de Go-to-Market",

        "https://www.felipebarbosa.me",
        "https://github.com/felipe-c-barbosa"
      ]
    },
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Felipe Barbosa | Consultoria em Marketing de Produto",

        "@type": "Person",
        "name": "Felipe Barbosa"

        "@type": "OfferCatalog",
        "name": "Serviços de Consultoria em Marketing de Produto",

            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Posicionamento & Messaging",
              "description": "Definição de ICP, framework de posicionamento, messaging hierarchy e validação com clientes reais."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Go-to-Market (GTM)",
              "description": "Estratégia de lançamento de produto, playbook de vendas e enablement, segmentação de canais e métricas de GTM."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Consultoria de Equipe PMM",
              "description": "Diagnóstico de maturidade PMM, definição de estrutura e papéis, processos e rituais de equipe, mentoria de líderes de PMM."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Pesquisa de Competidores",
              "description": "Mapeamento de landscape competitivo, análise de win/loss, battle cards para vendas e monitoramento contínuo do mercado."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Estratégia de Conteúdo PMM",
              "description": "Mapa de conteúdo por jornada do comprador, sales enablement content, thought leadership editorial e case studies."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Sessão Estratégica (1:1)",
              "description": "Sessão focada de 90 minutos para destravar um desafio específico de Marketing de Produto, com diagnóstico, framework e plano de ação documentado."

          }
        ]

      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://consultoria.felipebarbosa.me/#contato",
        "availableLanguage": "Portuguese"
      }
    }
